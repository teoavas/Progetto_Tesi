name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Controllo sintassi degli script
        # esclude generati/: contiene i test prodotti dai modelli, alcuni dei
        # quali sono sintatticamente non validi per costruzione (e' cio' che
        # lo studio misura), quindi non vanno compilati.
        run: python -m compileall -q -x '(generati|__pycache__)' benchmark locale
